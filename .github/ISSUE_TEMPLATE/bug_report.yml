name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste your GitHub token or private code.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a pull request with many files
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PR Sift version
      description: Shown in chrome://extensions
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Pull request size
      description: Approximate number of changed files. A public link helps if you can share one.
  - type: dropdown
    id: token
    attributes:
      label: Do you use a GitHub token?
      options: ['No', 'Yes']
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Errors from the GitHub tab (right click, Inspect, Console). Remove private data.
      render: shell
