name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm package
      - name: Check the tag matches the manifest version
        run: test "v$(node -p "require('./apps/extension/manifest.json').version")" = "$GITHUB_REF_NAME"
      - name: Take the release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" apps/extension/pr-sift-*.zip --notes-file release-notes.md --title "PR Sift $GITHUB_REF_NAME"
