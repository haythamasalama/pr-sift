name: Release

on:
  push:
    tags: ['v*']
  # Run by hand on main to tag and release the version in manifest.json, when a tag cannot be pushed.
  workflow_dispatch:
    inputs:
      replace:
        description: Delete this version's existing release and tag first, to publish it again (only before it reaches the store)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm package
      - name: Pick the tag
        run: |
          VERSION="v$(node -p "require('./apps/extension/manifest.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$VERSION" = "$GITHUB_REF_NAME"
          fi
          echo "TAG=$VERSION" >> "$GITHUB_ENV"
      - name: Take the release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$TAG" > release-notes.md
      - name: Remove the earlier release of this version
        if: github.event_name == 'workflow_dispatch' && inputs.replace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" apps/extension/pr-sift-*.zip --target "$GITHUB_SHA" --notes-file release-notes.md --title "PR Sift $TAG"
